name: Build Windows EXE

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Requirements
        run: |
          pip install -r requirements.txt

      - name: Install Extra PySide Dependencies
        run: |
          pip install PySide6 shiboken6 pyinstaller

      - name: Build LEXicon EXE
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon=icon.ico --name LEXicon --collect-all PySide6 --collect-all shiboken6 --hidden-import=shiboken6.Shiboken LEXicon.py

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: LEXicon-Windows
          path: dist/LEXicon
