name: Build Windows EXE

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Requirements
        shell: cmd
        run: |
          pip install -r requirements.txt

      - name: Install Extra Dependencies
        shell: cmd
        run: |
          pip install PySide6==6.7.3
          pip install shiboken6==6.7.3
          pip install pyinstaller
          pip install Pillow

      - name: Build LEXicon EXE
        shell: cmd
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon=icon.ico --name LEXicon --collect-submodules shiboken6 --collect-binaries shiboken6 --collect-data shiboken6 --collect-all PySide6 --hidden-import shiboken6.Shiboken --add-data "flags;flags" LEXicon_windows_optimised.py

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: LEXicon-Windows
          path: dist/LEXicon
