name: Build LEXicon Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.2 openpyxl==3.1.2 PySide6 pyinstaller

      - name: Build EXE
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name LEXicon `
            --icon=icon.ico `
            --collect-all numpy `
            --collect-all pandas `
            --collect-all PySide6 `
            LEXicon_windows_final_responsive_audiofix.py

      - name: Copy audio folder
        shell: powershell
        run: |
          if (Test-Path "audio") {
            Copy-Item -Path "audio" -Destination "dist/LEXicon/audio" -Recurse -Force
          }

      - name: Copy database
        shell: powershell
        run: |
          if (Test-Path "lexiko.db") {
            Copy-Item -Path "lexiko.db" -Destination "dist/LEXicon/" -Force
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEXicon-Windows
          path: dist/LEXicon
